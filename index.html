    <!-- <model-viewer> HTML element -->
    <model-viewer src="Big_Bucket.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="aces" poster="poster.webp" shadow-intensity="1" exposure="1" shadow-softness="0.7" auto-rotate camera-orbit="28.07deg 87.73deg 7.958m" field-of-view="26.26deg" environment-image="abandoned_tank_farm_04_4k.jpg" skybox-image="abandoned_tank_farm_04_4k.jpg">
